<style>a{color:var(--a)}.login{width:calc(100% - 24px);margin:8vh auto}.login button{min-height:44px}.login input{min-height:44px}#message{overflow-wrap:anywhere}#message.error{color:#ff896f}[hidden]{display:none!important}.help{font-size:14px;line-height:1.6}</style></head><body>
<main class="panel login"><div class="logo"><b>NE<span>XO</span></b><small>ORGANIZADOR</small></div>
<section id="requestView"><h2>Recupere seu acesso</h2><p class="muted">Informe o e-mail da sua conta NEXO.</p>
<form id="requestForm"><label>E-mail<input name="email" type="email" autocomplete="email" maxlength="254" required></label><button class="primary" type="submit">Enviar link de recuperação</button></form></section>
<section id="resetView" hidden><h2>Crie sua nova senha</h2><p class="muted help" id="rules">Use de 12 a 128 caracteres, com letras maiúsculas, minúsculas, números e símbolos.</p>
<form id="resetForm"><label>Nova senha<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" aria-describedby="rules" required></label><label>Confirme a nova senha<input name="confirmation" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><button class="primary" type="submit">Salvar nova senha</button></form></section>
<p id="message" role="status" aria-live="polite"></p><p><a href="./index.html">Voltar para entrar</a></p></main>
