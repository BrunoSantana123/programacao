name: OAuth regression tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oauth-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  oauth:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Test isolated OAuth flow and validation helper
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -v
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD

  local-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Prepare isolated Supabase, test account and fixtures
        run: python -m tools.setup_local_test --directory "$RUNNER_TEMP/nexo-test-environment"
      - name: Exercise real local OAuth and recovered MCP function
        run: python -m tools.validate_local_oauth --directory "$RUNNER_TEMP/nexo-test-environment"
      - name: Stop only this job's local Supabase
        if: always()
        shell: bash
        run: |
          if [ -x "$RUNNER_TEMP/nexo-test-environment/bin/supabase" ]; then
            "$RUNNER_TEMP/nexo-test-environment/bin/supabase" --workdir "$RUNNER_TEMP/nexo-test-environment" stop > /dev/null 2>&1
          fi
