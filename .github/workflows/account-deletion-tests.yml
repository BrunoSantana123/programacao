name: Account deletion tests
on:
  pull_request:
  push:
    branches: [main, feat/nexo-delete-account]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/test-account-deletion.mjs
