
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{margin:0;background:#101010;color:#f5f0e5;font:16px system-ui}
main{max-width:520px;margin:auto;padding:20px}
h1,h2,.gold{color:#e5bd68}
h1{letter-spacing:5px}
nav{display:flex;gap:6px;overflow:auto}
button{background:#cba454;color:#111;border:0;border-radius:9px;padding:11px;cursor:pointer;font-weight:700}

<main>

<script>

const SB_KEY='sb_publishable_0wRceuGGJaPnvA154onvEw_kQa-XCgp';
const SESSION_KEY='nexo_session_v3';
const DATA_KEY='nexo_v1';

const el=document.getElementById('view');
const money=x=>Number(x||0).toLocaleString('pt-BR',{

const num=x=>Number(x||0);
const input=(name,label,type='text',val='')=>`
<label>${label}
<input name="${name}" type="${type}" value="${esc(val)}"
${type==='number'?'step="0.01" min="0"':''} required>

function save(){
 localStorage.setItem(DATA_KEY,JSON.stringify(data));
 queueSync();
}

function total(x){
 return num(x.uber)+num(x.noventa)+num(x.particular)
 -num(x.recharge)-num(x.fuel)-num(x.food)
 -num(x.other)-num(x.reserve);
}

 let html='';

  </section>
  <section>
   <h3>Compromissos</h3>
   ${data.events.length?
    data.events.slice().sort((a,b)=>
      (a.date+a.time).localeCompare(b.date+b.time))
    .slice(0,5).map(x=>`<div class="item">
    ${esc(x.date)} ${esc(x.time||'')} — ${esc(x.name)}
    </div>`).join(''):
    'Nenhum compromisso cadastrado.'}
  </section>`;
 }

 if(page==='Finanças'){
  html=`
  <h2>Fechamento financeiro</h2>
  <section>
   <form id="entry">
    ${input('date','Data','date',today())}
    ${input('uber','Uber (R$)','number',0)}
    ${input('noventa','99 (R$)','number',0)}
    ${input('particular','Particulares (R$)','number',0)}
    ${input('recharge','Recarga (R$)','number',0)}
    ${input('fuel','Combustível (R$)','number',0)}

  </section>
  <section>
   <h3>Histórico</h3>
   ${data.entries.map((x,i)=>`
   <div class="item">

   </div>`).join('')||'Nenhum lançamento salvo.'}
  </section>
  <button id="export">Exportar dados (JSON)</button>`;
 }

 if(page==='Metas'){
  html=`<h2>Metas</h2>`+
  data.goals.map((g,i)=>{
   const percent=g.target?100*g.current/g.target:0;
   return `<section>
    <b>${esc(g.name)}</b>
    <div class="row">
     <span>${g.unit==='R$'?money(g.current):g.current}

    <form data-goal="${i}">
     ${input('current','Atualizar progresso','number',g.current)}
     <button>Atualizar</button>
    </form>
   </section>`;
  }).join('')+
  `<section>
   <h3>Nova meta</h3>
   <form id="goal">
    ${input('name','Descrição')}
    ${input('target','Objetivo numérico','number')}
    <label>Unidade
     <select name="unit">
      <option value="R$">R$</option>
      <option value="etapas">Etapas</option>
     </select>
    </label>
    <button>Adicionar</button>
   </form>
  </section>`;
 }

 if(page==='Agenda'){
  html=`
  <h2>Agenda e contas</h2>
  <section>
   <h3>Novo compromisso</h3>
   <form id="event">
    ${input('name','Compromisso')}

   </form>
  </section>
  <section>
   <h3>Compromissos</h3>
   ${data.events.slice().sort((a,b)=>
    (a.date+a.time).localeCompare(b.date+b.time))
    .map(x=>`<div class="item">
     ${esc(x.date)} às ${esc(x.time)} — ${esc(x.name)}
    </div>`).join('')||'Nenhum compromisso cadastrado.'}
  </section>
  <section>
   <h3>Contas</h3>
   ${data.bills.map((b,i)=>`<div class="item">
    <label><input type="checkbox" data-bill="${i}"
    ${b.paid?'checked':''}>
    ${esc(b.date)} · ${esc(b.name)} — ${money(b.amount)}
    </label></div>`).join('')}
  </section>`;
 }

 if(page==='Missões'){
  html=`
  <h2>Missões</h2>
  <section>
   <h3>${data.tasks.filter(x=>x.done).length*20} XP</h3>
   ${data.tasks.map((t,i)=>`<div class="item">
    <label><input type="checkbox" data-task="${i}"
    ${t.done?'checked':''}>${esc(t.name)}</label>
   </div>`).join('')}
  </section>
  <section>
   <form id="task">
    ${input('name','Nova missão')}
    <button>Adicionar missão</button>
   </form>
  </section>`;
 }

 el.innerHTML=(pendingImport?importPreview():'')+html;

 document.querySelectorAll('[data-page]').forEach(b=>{
  b.onclick=()=>{page=b.dataset.page;render()};
 });

 document.querySelectorAll('[data-bill]').forEach(b=>{
  b.onchange=()=>{
   data.bills[+b.dataset.bill].paid=b.checked;
   save();render();
  };
 });

 document.querySelectorAll('[data-task]').forEach(b=>{
  b.onchange=()=>{
   data.tasks[+b.dataset.task].done=b.checked;
   save();render();
  };
 });

 document.querySelectorAll('[data-del-entry]').forEach(b=>{
  b.onclick=()=>{
   if(!confirm('Excluir este lançamento?'))return;
   data.entries.splice(+b.dataset.delEntry,1);
   save();render();
  };
 });

 document.querySelectorAll('#view form').forEach(f=>{
  f.onsubmit=e=>{
   e.preventDefault();
   let v=Object.fromEntries(new FormData(f));

   if(f.id==='entry'){
    for(let k of importFields)v[k]=num(v[k]);
    data.entries.push(v);
   }else if(f.id==='goal'){
    data.goals.push({...v,target:num(v.target),current:0});
   }else if(f.dataset.goal!==undefined){
    data.goals[+f.dataset.goal].current=num(v.current);
   }else if(f.id==='event'){
    data.events.push(v);
   }else if(f.id==='task'){
    data.tasks.push({name:v.name,done:false});
   }
   save();render();
  };
 });

 const ex=document.getElementById('export');
 if(ex)ex.onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(
   [JSON.stringify(data,null,2)],
   {type:'application/json'}
  ));
  a.download='nexo-backup.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
 };

 const confirmButton=document.getElementById('confirm-import');
 if(confirmButton)confirmButton.onclick=()=>{
  if(data.entries.some(x=>x.importId===pendingImport.importId)){
   alert('Este lançamento já foi importado.');
   pendingImport=null;
   render();
   return;
  }
  if(data.entries.some(x=>x.date===pendingImport.date)){
   alert('Já existe lançamento nesta data. Confira o histórico antes de importar.');
   return;
  }
  data.entries.push(pendingImport);
  save();
  pendingImport=null;
  history.replaceState(null,'',location.pathname+location.search);
  page='Finanças';
  render();
  alert('Lançamento salvo. Confira o status da sincronização.');
 };

 const cancelButton=document.getElementById('cancel-import');
 if(cancelButton)cancelButton.onclick=()=>{
  pendingImport=null;
  history.replaceState(null,'',location.pathname+location.search);
  render();
 };
}

const importFields=[
 'uber','noventa','particular','recharge',
 'fuel','food','other','reserve'
];

function readImport(){
 try{
  if(!location.hash.startsWith('#import='))return null;
  const raw=decodeURIComponent(location.hash.slice(8));
  const obj=JSON.parse(decodeURIComponent(escape(
   atob(raw.replace(/-/g,'+').replace(/_/g,'/'))
  )));
  if(obj.type!=='nexo-entry'||obj.version!==1||
   typeof obj.date!=='string'||
   !/^\d{4}-\d{2}-\d{2}$/.test(obj.date)){
   throw Error('Dados inválidos');
  }
  let record={date:obj.date};
  for(const k of importFields){
   let n=num(obj[k]);
   if(!Number.isFinite(n)||n<0||n>10000000){
    throw Error('Valor inválido');
   }
   record[k]=n;
  }
  record.importId=String(obj.importId||JSON.stringify(record));
  return record;
 }catch(e){
  alert('Link de importação inválido. Nenhum dado foi salvo.');
  return null;
 }
}

pendingImport=readImport();
render();

const authHeaders=()=>({
 'apikey':SB_KEY,
 'Content-Type':'application/json',
 ...(session?.access_token?
  {'Authorization':'Bearer '+session.access_token}:{})
});

async function api(path,opts={}){
 const response=await fetch(SB_URL+path,{
  ...opts,
  headers:{...authHeaders(),...(opts.headers||{})}
 });
 const body=await response.text();
 let value;
 try{value=body?JSON.parse(body):null}
 catch{value=body}
 if(!response.ok){
  throw Error(value?.msg||value?.error_description||
   value?.message||('Erro HTTP '+response.status));
 }
 return value;
}

function setSession(s){
 session=s;
 if(s)localStorage.setItem(SESSION_KEY,JSON.stringify(s));
 else localStorage.removeItem(SESSION_KEY);
}

async function validSession(){
 if(!session)return false;
 if(Date.now()<((session.expires_at||0)*1000)-60000){
  return true;
 }
 if(!session.refresh_token){
  setSession(null);
  return false;
 }
 try{
  const s=await api('/auth/v1/token?grant_type=refresh_token',{
   method:'POST',
   body:JSON.stringify({refresh_token:session.refresh_token})
  });
  setSession({
   ...s,
   expires_at:Math.floor(Date.now()/1000)+s.expires_in
  });
  return true;
 }catch{
  setSession(null);
  return false;
 }
}

function showAccount(){
 const box=document.getElementById('account');
 if(!box)return;

 if(!session){
  box.innerHTML=`
  <section>
   <h3>Minha conta NEXO</h3>
   <p class="muted">
    Entre com a mesma conta no computador e celular.
    Confirme o e-mail se solicitado.
   </p>
   <form id="auth-form">
    <label>E-mail
     <input name="email" type="email"
      autocomplete="email" required>
    </label>
    <label>Senha
     <input name="password" type="password"
      autocomplete="current-password" minlength="6" required>
    </label>
    <button type="submit" name="action" value="login">
     Entrar
    </button>
    <button type="submit" name="action" value="signup"
     style="background:#555;color:white">
     Criar cadastro
    </button>
   </form>
   <p id="auth-msg" class="muted"></p>
  </section>`;

  const f=document.getElementById('auth-form');
  f.onsubmit=async e=>{
   e.preventDefault();
   const action=e.submitter?.value||'login';
   const v=Object.fromEntries(new FormData(f));
   const msg=document.getElementById('auth-msg');
   msg.textContent='Aguarde...';

   try{
    const endpoint=action==='signup'?
     '/auth/v1/signup':
     '/auth/v1/token?grant_type=password';

    const r=await api(endpoint,{
     method:'POST',
     body:JSON.stringify({
      email:v.email,
      password:v.password
     })
    });

    if(!r.access_token){
     msg.textContent=
      'Cadastro solicitado. Confira seu e-mail, confirme o endereço e depois clique em Entrar.';
     return;
    }

    setSession({
     ...r,
     expires_at:Math.floor(Date.now()/1000)+r.expires_in
    });
    await loadCloud();

   }catch(err){
    msg.textContent='Não foi possível autenticar: '+err.message;
   }
  };
  return;
 }

 const email=esc(session.user?.email||'Conta conectada');
 box.innerHTML=`
 <section>
  <div class="row">
   <b>Conta: ${email}</b>
   <button id="logout" style="background:#555;color:white">
    Sair
   </button>
  </div>
  <p id="sync-status" class="muted">${esc(syncStatus)}</p>
  ${cloudReady?'<button id="manual-sync">Sincronizar agora</button>':''}
 </section>`;

 document.getElementById('logout').onclick=async()=>{
  try{
   await api('/auth/v1/logout',{method:'POST'});
  }catch{}
  setSession(null);
  cloudReady=false;
  syncStatus='Sem login — dados apenas neste navegador';
  showAccount();
 };

 const m=document.getElementById('manual-sync');
 if(m)m.onclick=()=>syncNow();
}

function status(msg){
 syncStatus=msg;
 showAccount();
}

async function loadCloud(){
 if(!await validSession()){
  cloudReady=false;
  showAccount();
  return;
 }

 try{
  status('Consultando seus dados na nuvem...');

  const rows=await api(
   '/rest/v1/nexo_data?select=data,updated_at&user_id=eq.'+
   encodeURIComponent(session.user.id),
   {headers:{'Accept':'application/json'}}
  );

  if(rows.length){
   const remote=rows[0].data;
   if(!remote||
    !Array.isArray(remote.entries)||
    !Array.isArray(remote.bills)||
    !Array.isArray(remote.goals)||
    !Array.isArray(remote.tasks)||
    !Array.isArray(remote.events)){
    throw Error('Dados remotos inválidos');
   }

   localStorage.setItem(
    'nexo_before_cloud_'+Date.now(),
    JSON.stringify(data)
   );

   data=remote;
   localStorage.setItem(DATA_KEY,JSON.stringify(data));
   cloudReady=true;
   status('Sincronizado — dados carregados da nuvem');
   render();

  }else{
   cloudReady=false;
   status('Nuvem vazia. Seus dados locais estão preservados.');

   const box=document.getElementById('account');
   const b=document.createElement('button');
   b.textContent='Enviar meus dados deste aparelho para a nuvem';

   b.onclick=async()=>{
    if(!confirm(
     'Você já exportou seu backup JSON? O primeiro envio criará a base na nuvem com os dados deste aparelho.'
    ))return;

    cloudReady=true;
    await syncNow();
    render();
   };

   box.querySelector('section').appendChild(b);
  }

 }catch(err){
  cloudReady=false;
  status('Falha ao consultar nuvem: '+err.message);
 }
}

function queueSync(){
 if(!session||!cloudReady)return;
 status('Alterações locais aguardando sincronização...');
 clearTimeout(syncTimer);
 syncTimer=setTimeout(syncNow,600);
}

async function syncNow(){
 if(!session||!cloudReady)return;
 if(syncing){
  syncAgain=true;
  return;
 }

 syncing=true;

 try{
  if(!await validSession()){
   throw Error('Sessão expirada. Entre novamente.');
  }

  const snapshot=JSON.stringify(data);

  await api('/rest/v1/nexo_data?on_conflict=user_id',{
   method:'POST',
   headers:{
    'Prefer':'resolution=merge-duplicates,return=minimal'
   },
   body:JSON.stringify({
    user_id:session.user.id,
    data:JSON.parse(snapshot)
   })
  });

  status('Sincronizado com a nuvem');

  if(JSON.stringify(data)!==snapshot){
   syncAgain=true;
  }

 }catch(err){
  status('Não sincronizado: '+err.message+
   ' — dados locais preservados');
 }finally{
  syncing=false;
  if(syncAgain){
   syncAgain=false;
   queueSync();
  }
 }
}

showAccount();
if(session)loadCloud();

 
<style>

nav button{min-width:90px}
nav{padding:5px 0}
.nexo-calendar{margin-bottom:15px}
.nexo-calhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:15px}
.nexo-calhead strong{text-transform:capitalize;font-size:20px}
.nexo-calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.nexo-calendar-grid>span{text-align:center;color:#aaa;font-size:11px}
.nexo-day{min-width:0;min-height:70px;padding:7px;background:#26232a;color:#f7eddf;border:1px solid #615033;border-radius:9px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:none}
.nexo-day.selected{background:linear-gradient(130deg,#bc872f,#ffe69c);color:#271903}
.nexo-day b{font-size:12px}
.nexo-day em{font-style:normal;font-size:10px;color:#f2c75f}
.nexo-day.selected em{color:#35200a}
.nexo-event{padding:10px 0;border-bottom:1px solid #ffffff20}
.nexo-event:last-child{border:0}
.nexo-event time{color:#f5c766;font-weight:800}
@media(max-width:600px){
.nexo-day{min-height:51px;padding:5px}
.nexo-day b{font-size:11px}
.nexo-calhead strong{font-size:16px}
.nexo-calhead button{padding:8px}
}
</style>
<script>
(()=>{
 const originalRender=render;
 let selected=new Date().toLocaleDateString('sv-SE',{timeZone:'America/Sao_Paulo'});
 let month=selected.slice(0,7);

 function calendar(){
  const [year,m]=month.split('-').map(Number);
  const first=new Date(year,m-1,1);
  const last=new Date(year,m,0).getDate();
  const title=first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  const counts={};

  for(const ev of data.events){
   counts[ev.date]=(counts[ev.date]||0)+1;
  }

  const days=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb']
   .map(d=>`<span>${d}</span>`);

  for(let i=0;i<first.getDay();i++){
   days.push('<span></span>');
  }

  for(let day=1;day<=last;day++){
   const date=month+'-'+String(day).padStart(2,'0');
   days.push(`
    <button type="button"
     class="nexo-day ${selected===date?'selected':''}"
     data-cdate="${date}">
     <b>${day}</b>
     <em>${counts[date]?counts[date]+' compromisso(s)':''}</em>
    </button>`);
  }

  const events=data.events.filter(e=>e.date===selected)
   .sort((a,b)=>(a.time||'').localeCompare(b.time||''));

  const box=document.createElement('section');
  box.className='nexo-calendar';
  box.innerHTML=`
   <div class="nexo-calhead">
    <strong>${title}</strong>
    <div>
     <button type="button" data-cmove="-1">‹</button>
     <button type="button" data-cmove="1">›</button>
    </div>
   </div>
   <div class="nexo-calendar-grid">${days.join('')}</div>
   <h3>Compromissos de ${selected.split('-').reverse().join('/')}</h3>
   ${events.map(e=>`
    <div class="nexo-event">
     <time>${esc(e.time||'Sem horário')}</time>
     — ${esc(e.name)}
    </div>`).join('')||'<p class="muted">Nenhum compromisso nesse dia.</p>'}
   <p class="muted">Para adicionar, use o formulário abaixo.</p>`;

  el.prepend(box);

  for(const b of box.querySelectorAll('[data-cdate]')){
   b.onclick=()=>{
    selected=b.dataset.cdate;
    render();
   };
  }

  for(const b of box.querySelectorAll('[data-cmove]')){
   b.onclick=()=>{
    const d=new Date(year,m-1+Number(b.dataset.cmove),1);
    month=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    selected=month+'-01';
    render();
   };
  }

  const field=el.querySelector('#event [name="date"]');
  if(field)field.value=selected;
 }

 render=function(){
  originalRender();
  if(page==='Agenda')calendar();
 };
 render();
})();
</script>

</script>
</body>
</html>
