<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101010"><title>NEXO</title><style>body{margin:0;background:#101010;color:#f5f0e5;font:16px system-ui}main{max-width:520px;margin:auto;padding:20px}h1,h2,.gold{color:#e5bd68}h1{letter-spacing:5px}nav{display:flex;gap:6px;overflow:auto}button{background:#cba454;color:#111;border:0;border-radius:9px;padding:11px;cursor:pointer;font-weight:700}nav button{flex:1;min-width:75px}section{background:#202020;padding:16px;border-radius:14px;margin:12px 0}input,select{box-sizing:border-box;width:100%;background:#303030;color:white;border:1px solid #655330;padding:10px;border-radius:8px;margin:5px 0 12px}label{display:block;font-size:13px;color:#ccc}.row{display:flex;justify-content:space-between;gap:12px;margin:9px 0}.bar{background:#51452c;height:12px;border-radius:12px;overflow:hidden}.fill{background:#e5bd68;height:100%}.muted{color:#aaa;font-size:13px}.hidden{display:none}.item{padding:10px 0;border-bottom:1px solid #383838}input[type=checkbox]{width:auto;margin-right:10px}small{color:#aaa}</style></head><body><main><header><h1>NEXO</h1><div class="muted">Sua central de evolução • Protótipo local</div></header><nav id="nav"></nav><div id="view"></div><p class="muted">Dados armazenados somente neste navegador. Faça backup regularmente. Não há sincronização com o ChatGPT nem notificações automáticas nesta versão.</p></main><script>
const initial={entries:[],bills:[{name:'Celular',date:'2026-11-10',amount:200,paid:false},{name:'Seguro do carro',date:'2026-11-15',amount:1300,paid:false},{name:'Gás',date:'2026-11-15',amount:250,paid:false},{name:'Cartão',date:'2026-11-15',amount:500,paid:false},{name:'Faculdade (data planejada)',date:'2026-11-20',amount:500,paid:false},{name:'Plano Isabela (data planejada)',date:'2026-11-20',amount:500,paid:false},{name:'Luz',date:'2026-11-28',amount:1000,paid:false}],events:[],tasks:[{name:'Conferir faturamento',done:false},{name:'Separar reserva de manutenção',done:false},{name:'Revisar contas',done:false},{name:'Estudar Python',done:false}],goals:[{name:'Meta líquida diária',target:360,current:218.64,unit:'R$'},{name:'Revisão BYD King',target:2472,current:0,unit:'R$'}]};
let data;try{data=JSON.parse(localStorage.getItem('nexo_v1'))||initial}catch{data=initial}let page='Início';const money=x=>Number(x||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),today='2026-11-12';const save=()=>localStorage.setItem('nexo_v1',JSON.stringify(data));const el=document.getElementById('view');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const input=(name,label,type='text',val='')=>`<label>${label}<input name="${name}" type="${type}" value="${esc(val)}" ${type==='number'?'step="0.01" min="0"':''} required></label>`;function render(){document.getElementById('nav').innerHTML=['Início','Finanças','Metas','Agenda','Missões'].map(p=>`<button data-page="${p}" style="${p===page?'':'background:#333;color:#ddd'}">${p}</button>`).join('');let html='';if(page==='Início'){let e=data.entries.filter(x=>x.date===today),rev=e.reduce((s,x)=>s+x.uber+x.noventa+x.particular,0),expense=e.reduce((s,x)=>s+x.recharge+x.fuel+x.food+x.other+x.reserve,0),net=e.length?rev-expense:218.64;html=`<h2>Agenda do dia</h2><small>12/11/2026 • Exemplo inicial até registrar novo fechamento</small><section><div class="gold">META LÍQUIDA</div><h2>${money(360)}</h2><div class="bar"><div class="fill" style="width:${Math.min(100,Math.max(0,net/360*100))}%"></div></div><div class="row"><span>Resultado ${e.length?'registrado':'da simulação'}</span><b>${money(net)}</b></div><div class="row"><span>Falta</span><b>${money(Math.max(0,360-net))}</b></div></section><section><h3>Próximas contas</h3>${data.bills.filter(x=>!x.paid).slice(0,4).map(x=>`<div class="row"><span>${esc(x.date.slice(8))}/11 · ${esc(x.name)}</span><b>${money(x.amount)}</b></div>`).join('')}</section><section><h3>Compromissos</h3>${data.events.length?data.events.slice(0,5).map(x=>`<div class="item">${esc(x.date)} ${esc(x.time||'')} — ${esc(x.name)}</div>`).join(''):'Nenhum compromisso cadastrado.'}</section>`}if(page==='Finanças'){html=`<h2>Fechamento financeiro</h2><section><form id="entry">${input('date','Data','date',today)}${input('uber','Uber (R$)','number',166.14)}${input('noventa','99 (R$)','number',139.50)}${input('particular','Particulares (R$)','number',0)}${input('recharge','Recarga (R$)','number',27)}${input('fuel','Combustível (R$)','number',0)}${input('food','Alimentação (R$)','number',30)}${input('other','Outras despesas (R$)','number',0)}${input('reserve','Reserva de manutenção (R$)','number',30)}<button>Salvar lançamento</button></form></section><section><h3>Histórico</h3>${data.entries.map((x,i)=>`<div class="item">${esc(x.date)} — ${money(x.uber+x.noventa+x.particular-x.recharge-x.fuel-x.food-x.other-x.reserve)} líquido <button data-del-entry="${i}">Excluir</button></div>`).join('')||'Nenhum lançamento salvo.'}</section><button id="export">Exportar dados (JSON)</button>`}if(page==='Metas'){html=`<h2>Metas</h2>${data.goals.map((g,i)=>`<section><b>${esc(g.name)}</b><div class="row"><span>${g.unit==='R$'?money(g.current):g.current} / ${g.unit==='R$'?money(g.target):g.target}</span><span>${Math.round(100*g.current/g.target)}%</span></div><div class="bar"><div class="fill" style="width:${Math.min(100,100*g.current/g.target)}%"></div></div><form data-goal="${i}">${input('current','Atualizar progresso','number',g.current)}<button>Atualizar</button></form></section>`).join('')}<section><h3>Nova meta</h3><form id="goal">${input('name','Descrição')}${input('target','Objetivo numérico','number')}<label>Unidade<select name="unit"><option value="R$">R$</option><option value="etapas">Etapas</option></select></label><button>Adicionar</button></form></section>`}if(page==='Agenda'){html=`<h2>Agenda e contas</h2><section><h3>Novo compromisso</h3><form id="event">${input('name','Compromisso')}${input('date','Data','date',today)}${input('time','Hora','time','14:00')}<button>Adicionar</button></form></section><section><h3>Calendário de compromissos</h3>${data.events.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map((x,i)=>`<div class="item">${esc(x.date)} às ${esc(x.time)} — ${esc(x.name)}</div>`).join('')||'Nenhum compromisso cadastrado.'}</section><section><h3>Contas</h3>${data.bills.map((b,i)=>`<div class="item"><label><input type="checkbox" data-bill="${i}" ${b.paid?'checked':''}>${esc(b.date)} · ${esc(b.name)} — ${money(b.amount)}</label></div>`).join('')}</section>`}if(page==='Missões'){html=`<h2>Missões</h2><section><h3>${data.tasks.filter(x=>x.done).length*20} XP</h3>${data.tasks.map((t,i)=>`<div class="item"><label><input type="checkbox" data-task="${i}" ${t.done?'checked':''}>${esc(t.name)}</label></div>`).join('')}</section><section><form id="task">${input('name','Nova missão')}<button>Adicionar missão</button></form></section>`}el.innerHTML=html;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});document.querySelectorAll('[data-bill]').forEach(b=>b.onchange=()=>{data.bills[+b.dataset.bill].paid=b.checked;save();render()});document.querySelectorAll('[data-task]').forEach(b=>b.onchange=()=>{data.tasks[+b.dataset.task].done=b.checked;save();render()});document.querySelectorAll('[data-del-entry]').forEach(b=>b.onclick=()=>{data.entries.splice(+b.dataset.delEntry,1);save();render()});document.querySelectorAll('form').forEach(f=>f.onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(f));if(f.id==='entry'){for(let k of ['uber','noventa','particular','recharge','fuel','food','other','reserve'])v[k]=Number(v[k]||0);data.entries.push(v)}else if(f.id==='goal'){data.goals.push({...v,target:Number(v.target),current:0})}else if(f.dataset.goal!==undefined){data.goals[+f.dataset.goal].current=Number(v.current)}else if(f.id==='event'){data.events.push(v)}else if(f.id==='task'){data.tasks.push({name:v.name,done:false})}save();render()});let ex=document.getElementById('export');if(ex)ex.onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='nexo-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}}render();
</script></body></html>
